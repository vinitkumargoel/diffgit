name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      # `bun run perf` needs the perf-5k and perf-log fixtures, which only FIXTURES_PERF=1 builds.
      - run: FIXTURES_PERF=1 bun run fixtures
      - run: bun run check
      - run: bun run perf
      - run: bun run build
      - run: scripts/check-dist.sh
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run fixtures
      - run: bunx playwright install --with-deps chromium
      # playwright.config.ts builds with VITE_E2E=1 and serves dist with vite preview (production CSP)
      - run: bunx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
